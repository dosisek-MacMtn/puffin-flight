# Publishes the built game to GitHub Pages, which gives the PWA the HTTPS
# origin it needs to be installable on a phone.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# The site then lands at https://<owner>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/puffin-flight-game-3yk51g'
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build from source rather than trusting the committed dist/, so what
      # ships always matches src/ and assets/.
      - name: Build
        run: node build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
